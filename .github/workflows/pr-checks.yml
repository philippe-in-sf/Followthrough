name: PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # React Router's remaining high advisory applies to its unused RSC mode.
      # Keep it visible until a compatible patched release exists without
      # making every pull request fail on an unreachable code path.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check changelog
        run: npm run changelog:check

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
